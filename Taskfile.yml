version: "3"

tasks:
  lint:
    desc: Run ruff lint and format checks
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  test:
    desc: Run pytest without coverage
    cmds:
      - uv run pytest --no-cov

  test:coverage:
    desc: Run pytest with coverage (fail under 80%)
    cmds:
      - uv run pytest

  test:ci:
    desc: Validate and run CI workflow locally using act
    cmds:
      - act --validate
      - act -j ci

  test:ica:
    desc: Smoke-test the live ICA endpoint (requires ICA_OPENCODE_API_KEY)
    cmds:
      - ./scripts/test-ica.sh

  clean:
    desc: Remove cache, coverage, and temp artefacts
    cmds:
      - rm -rf .pytest_cache .coverage htmlcov .ruff_cache .tmp
      - find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
