[project]
name = "opencode-launcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "questionary",
    "rich",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["."]
include = ["opencode-launcher.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def header",
    "def abort",
    "def _panel",
    "def _nav_hint",
    "def show_litellm_table",
    "def show_ica_table",
    "def show_ollama_table",
    "def show_nvidia_table",
    "def show_openrouter_table",
    "def pick_provider",
    "def _pick",
    "def pick_litellm_model",
    "def pick_ollama_model",
    "def pick_nvidia_model",
    "def pick_openrouter_model",
]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["opencode_launcher"]
